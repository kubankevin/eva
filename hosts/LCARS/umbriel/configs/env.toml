# ==================================================
#  LCARS
#  AMD Ryzen 9 9950X3D + NVIDIA RTX 5090
#  Arch Linux + CachyOS Kernel | Noctalia v5
#  Umbriel Session, Input and Environment
# ==================================================

# === Session ===
[general]
autostart = ["noctalia", "openrgb --profile LCARS", "steam -silent"]
mod_key = "Super"
show_cheatsheet = false
xwayland = true

# === Input Devices ===
[input.cursor]
follows_focus = true
size = 24
theme = "Bibata-Modern-Ice"

[input.focus]
follows_mouse = true

[input.keyboard]
repeat_delay = 300
repeat_rate = 50

[environment]
# === Wayland & Toolkits ===
CLUTTER_BACKEND = "wayland"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
GDK_BACKEND = "wayland,x11,*"
QT_AUTO_SCREEN_SCALE_FACTOR = "1"
QT_QPA_PLATFORM = "wayland;xcb"
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"
SDL_VIDEODRIVER = "wayland"
XCURSOR_SIZE = "24"
XCURSOR_THEME = "Bibata-Modern-Ice"

# === NVIDIA & Hardware Acceleration ===
__GL_GSYNC_ALLOWED = "1"
__GL_SHADER_DISK_CACHE = "1"
__GL_SHADER_DISK_CACHE_SIZE = "107374182400"
GSK_RENDERER = "ngl"
LIBVA_DRIVER_NAME = "nvidia"
MOZ_DISABLE_RDD_SANDBOX = "1"
NVD_BACKEND = "direct"
