# ==================================================
#  PC107001
#  Intel Xeon Silver 4216 + NVIDIA Quadro P2200
#  Arch Linux + CachyOS Kernel | Noctalia v5
#  Umbriel Keybinds
# ==================================================

[keybinds]

# === Applications ===
"Mod+B" = "spawn:firefox"
"Mod+E" = "spawn:thunar"
"Mod+Return" = "spawn:kitty"

# === Noctalia Interface & Utilities ===
"Alt+Tab" = "spawn:noctalia msg window-switcher"
"Ctrl+Alt+Delete" = "spawn:noctalia msg panel-toggle session"
"Mod+A" = "spawn:noctalia msg panel-toggle control-center audio"
"Mod+Alt+S" = "spawn:noctalia msg screenshot-fullscreen"
"Mod+Comma" = "spawn:noctalia msg settings-toggle"
"Mod+Ctrl+A" = "spawn:noctalia msg annotate"
"Mod+I" = "overview-toggle"
"Mod+L" = "spawn:noctalia msg session lock"
"Mod+N" = "spawn:noctalia msg panel-toggle control-center notifications"
"Mod+S" = "spawn:noctalia msg panel-toggle control-center"
"Mod+Shift+A" = "spawn:noctalia msg screenshot-annotate"
"Mod+Shift+N" = "spawn:noctalia msg nightlight-force-toggle"
"Mod+Shift+S" = "spawn:noctalia msg screenshot-region"
"Mod+Space" = "spawn:noctalia msg panel-toggle launcher"
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+W" = "spawn:noctalia msg panel-toggle wallpaper"

# === Hardware & Media ===
"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down"
"XF86AudioMicMute" = "spawn:noctalia msg mic-mute"
"XF86AudioMute" = "spawn:noctalia msg volume-mute"
"XF86AudioNext" = "spawn:noctalia msg media next"
"XF86AudioPlay" = "spawn:noctalia msg media toggle"
"XF86AudioPrev" = "spawn:noctalia msg media previous"
"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up"
"XF86AudioStop" = "spawn:noctalia msg media stop"
"XF86MonBrightnessDown" = "spawn:noctalia msg brightness-down"
"XF86MonBrightnessUp" = "spawn:noctalia msg brightness-up"
"XF86Sleep" = "spawn:noctalia msg session lockAndSuspend"

# === Window State ===
"Mod+Ctrl+F" = "window-toggle-maximize"
"Mod+F" = "window-toggle-floating"
"Mod+Q" = "window-close"
"Mod+Shift+F" = "window-toggle-fullscreen"

# === Focus & Movement (Windows) ===
"Mod+Down" = "window-focus-down"
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Ctrl+Left" = "window-move-or-output-left"
"Mod+Ctrl+Right" = "window-move-or-output-right"
"Mod+Ctrl+Up" = "window-move-up"

# === Monitor / Output Focus ===
"Mod+Alt+Left" = "output-focus-left"
"Mod+Alt+Right" = "output-focus-right"

# === Workspace Navigation ===
"Mod+Shift+Left" = "workspace-previous"
"Mod+Shift+Right" = "workspace-next"

# === Workspaces (Switching) ===
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+0" = "workspace-switch:10"

# === Workspaces (Move Window) ===
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"
"Mod+Shift+0" = "window-move-to-workspace:10"
