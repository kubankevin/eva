# ==================================================
#  PC107001
#  Intel Xeon Silver 4216 + NVIDIA Quadro P2200
#  Umbriel Window Rules
# ==================================================

# === Fallback Opacity ===
[[window_rule]]
opacity = 1.0

# === Blur Catch-All ===
[[window_rule]]
blur = true
blur_optimized = true

# === Basic Dialogs ===
[[window_rule]]
default_floating = true
default_position = { x = 0, y = 0 }
match.title = "^Authentication Required$"

[[window_rule]]
default_floating = true
default_floating_size = { width = 0.7, height = 0.6 }
default_position = { x = 0, y = 0 }
match.title = "^Save As$"

[[window_rule]]
default_floating = true
default_floating_size = { width = 0.7, height = 0.6 }
default_position = { x = 0, y = 0 }
match.title = "^Open Files$"

# === Firefox Webmail Dialogs ===
[[window_rule]]
default_floating = true
default_floating_size = { width = 0.5, height = 0.6 }
default_position = { x = 0, y = 0 }
match.app_id = "^([Ff]irefox)$"
match.title = "^New mail"

# === Noctalia Settings ===
[[window_rule]]
default_floating = true
default_floating_size_px = { width = 1080, height = 920 }
match.app_id = "^dev.noctalia.Noctalia$"

# === Noctalia Share Picker ===
[[window_rule]]
default_floating = true
default_floating_size = { width = 0.5, height = 0.6 }
default_position = { x = 0, y = 0 }
match.app_id = "^dev.noctalia.UmbrielSharePicker$"

# === OpenRSAT Windows ===
[[window_rule]]
default_floating = true
default_floating_size = { width = 0.6, height = 0.6 }
default_position = { x = 0, y = 0 }
match.app_id = "^OpenRSAT-linux-x64$"
match.title = "^(?!.*OpenRSAT).*$"

# === Picture-in-Picture ===
[[window_rule]]
default_floating = true
default_floating_size = { width = 0.3, height = 0.3 }
default_maximize = false
default_position = { anchor = "bottom_right", x = 20, y = 20 }
match.title = "^(Picture-in-Picture|Picture in picture)$"
opacity = 0.95

# === Screen Share & Overlay Indicators ===
[[window_rule]]
default_floating = true
default_floating_size = { width = 0.3, height = 0.3 }
default_position = { anchor = "bottom_left", x = 20, y = 20 }
match.app_id = "^(teams-for-linux|OpenRSAT-linux-x64)$"
match.title = "^(Teams for Linux - Screen is being shared|OpenRSAT Authentication)$"

# === Thunar Dialogs ===
[[window_rule]]
default_floating = true
default_position = { x = 0, y = 0 }
match.app_id = "^thunar$"
match.title = "^(?!.*[Tt]hunar).*$"

# === Utility Apps ===
[[window_rule]]
default_floating = true
default_floating_size = { width = 0.6, height = 0.6 }
default_position = { x = 0, y = 0 }
match.app_id = "^(nvidia-settings|timeshift-gtk|com\\.gabm\\.satty|Satty|file-roller|org\\.gnome\\.FileRoller)$"
